apply from: rootProject.file('gradle/versioning.gradle')

buildscript {
  ext.kotlin_version = '2.4.0'
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
    maven {
      url 'https://plugins.gradle.org/m2/'
    }
  }

  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0'
    classpath 'com.android.tools.build:gradle:9.2.1'
    // Cannot bump: Breaks functionality.
    classpath 'com.diffplug.spotless:spotless-plugin-gradle:7.0.4'
    classpath 'com.getkeepsafe.dexcount:dexcount-gradle-plugin:4.0.0'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

allprojects {
  buildscript {
    repositories {
      google()
      mavenCentral()
    }
  }

  apply plugin: 'idea'

  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }

  group = GROUP
  version = getVersionName()
}

// Updated Java compatibility check
if (JavaVersion.current().isJava8Compatible()) {
  allprojects {
    tasks.withType(Javadoc).tap {
      configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
      }
    }
  }
}

def isCI = "true".equals(System.getenv("CIRCLECI"))
def preDexEnabled = "true".equals(System.getProperty("preDex", "true"))

ext {
  versionCode = Integer.parseInt(VERSION_CODE)
  versionName = getVersionName()

  minSdkVersion = 23
  minSdkVersionWear = 25
  targetSdkVersion = 35
  compileSdkVersion = 36

  sourceCompatibilityVersion = JavaVersion.VERSION_17
  targetCompatibilityVersion = JavaVersion.VERSION_17

  preDexLibraries = preDexEnabled && !isCI
}

ext.deps = [
  supportAnnotations: 'androidx.annotation:annotation:1.10.0'
]

apply plugin: 'com.diffplug.spotless'
